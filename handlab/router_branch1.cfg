!
! Handslab (IZRT)
! Konfiguracja router BRANCH1
!

en
conf t
no ip domain-lookup

! Zmiana nazwy sprzętu
host BRANCH1

! Aktywacja routingu IPv6
ipv6 unicast-routing

! Adresacja GigabitEthernet 0/0/0
int g0/0/0
no ip addr
ipv6 addr fe80::1 link-local
ipv6 addr 2001:db8:acad:1::1/64
ipv6 nd other-config-flag
exit

! Adresacja GigabitEthernet 0/0/2
int g0/0/2
ip addr 81.26.4.2 255.255.255.252
no shut
exit

! Konfiguracja EIGRP
router eigrp 1
network 81.26.4.0 0.0.0.3
no auto-summary
exit

! Konfiguracja tunelu VPN
int Tunnel1
no ip addr
mtu 1476
ipv6 addr 2001:DB8:ACAD:12::1/64
tunnel mode ipv6ip
tunnel source g0/0/2
tunnel dest 209.165.200.2
exit

! Konfiguracja OSPF w ramach sieci VPN
ipv6 router ospf 1
router-id 1.1.1.1
exit

int Tunnel1
ipv6 ospf 1 area 0
exit

int g0/0/0
ipv6 ospf 1 area 0
exit

! Wyjście i zapis
end
wr
