!
! Handslab (IZRT)
! Konfiguracja routera IPv4-2
!

en
conf t
no ip domain-lookup

! Zmiana nazwy sprzętu
host IPv4-2

! Adresacja FastEthernet 0/0
int f0/0
ip addr 209.165.200.1 255.255.255.252
no shut
exit

! Adresacja FastEthernet 0/1
int f0/1
ip addr 195.29.151.2 255.255.255.252
no shut
exit

! Konfiguracja EIGRP
router eigrp 1
network 209.165.200.0 0.0.0.3
network 195.29.151.0 0.0.0.3
no auto-summary
exit

! Wyjście i zapis
end
wr
